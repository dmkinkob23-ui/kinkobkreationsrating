<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rate Kinkob Kreations</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#001f3f;
  font-family:Segoe UI, Arial, sans-serif;
}
.card{
  background:#fff;
  padding:30px;
  border-radius:16px;
  width:90%;
  max-width:400px;
  text-align:center;
}
.logo{width:150px;margin-bottom:12px;}
.google{width:60px;vertical-align:middle;margin-right:6px;}
h1{font-size:20px;color:#333;}
p{color:#666;margin-bottom:20px;}

.stars{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}
.star{
  font-size:38px;
  cursor:pointer;
  color:transparent;
  -webkit-text-stroke:1.5px #ffb400;
}
.star.filled{
  color:#ffb400;
}

button{
  background:#001f3f;
  color:#fff;
  border:none;
  padding:12px 24px;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
button:disabled{
  background:#999;
  cursor:not-allowed;
}

.sub{
  font-size:13px;
  color:#777;
  margin-top:12px;
}
</style>
</head>

<body>
<div class="card">
  <img src="https://i.ibb.co/bjdZBy8z/Hotel-Logo-25.png" class="logo">

  <h1>
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" class="google">
    Rate Us
  </h1>
  <p>Our Service and Product</p>

  <div class="stars">
    <span class="star" data-value="1">★</span>
    <span class="star" data-value="2">★</span>
    <span class="star" data-value="3">★</span>
    <span class="star" data-value="4">★</span>
    <span class="star" data-value="5">★</span>
  </div>

  <button id="submitBtn" disabled>Submit Rating</button>

  <div class="sub">Your feedback helps us improve every day.</div>
</div>

<script>
const GOOGLE_REVIEW_URL =
"https://search.google.com/local/writereview?placeid=ChIJ__H40ZHA1DsRuttOMA30ZAc";

const FEEDBACK_FORM_URL =
"https://docs.google.com/forms/d/e/1FAIpQLSdAVc_T-60P-Vuj5AFvleyz7cvKWGVmu6FrGZb4CMaqvz1oqQ/viewform";

let selectedRating = 0;
const stars = document.querySelectorAll('.star');
const submitBtn = document.getElementById('submitBtn');

stars.forEach(star=>{
  star.addEventListener('click',()=>{
    selectedRating = parseInt(star.dataset.value);
    stars.forEach(s=>s.classList.remove('filled'));
    for(let i=0;i<selectedRating;i++){
      stars[i].classList.add('filled');
    }
    submitBtn.disabled = false;
  });
});

submitBtn.addEventListener('click',()=>{
  if(selectedRating === 0) return;

  if(selectedRating >= 4){
    alert("Thank you! Please leave us a Google review ⭐⭐⭐⭐⭐");
    window.location.href = GOOGLE_REVIEW_URL;
  }else{
    alert("Thank you! Please share your feedback with us.");
    window.location.href = FEEDBACK_FORM_URL;
  }
});
</script>
</body>
</html>
